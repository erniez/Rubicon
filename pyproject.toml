[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubicon"
version = "0.1.0"
description = "Language-agnostic code architecture visualization and design rule checking"
requires-python = ">=3.11"
authors = [{name = "Ernie Zappacosta"}]
license = {text = "MIT"}
keywords = ["architecture", "linting", "tree-sitter", "visualization", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9",
    "networkx>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-kotlin>=0.1",
    "tree-sitter-swift>=0.0.1",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    "pathspec>=0.11",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "httpx>=0.24",
]
[project.urls]
Homepage = "https://github.com/erniez/Rubicon"
Repository = "https://github.com/erniez/Rubicon"
Issues = "https://github.com/erniez/Rubicon/issues"

[project.scripts]
rubicon = "rubicon.cli:app"

[tool.setuptools.packages.find]
include = ["rubicon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
