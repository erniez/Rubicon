<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubicon — Architecture Visualization</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header id="header">
        <h1>Rubicon</h1>
        <nav id="breadcrumb">
            <span class="crumb active">Layers</span>
        </nav>
    </header>
    <div id="diff-banner" style="display: none;">
        <span id="diff-summary"></span>
        <button id="diff-toggle" title="Toggle diff overlay">Hide Diff</button>
    </div>
    <div id="viz-container">
        <svg id="layer-diagram"></svg>
    </div>
    <div id="tooltip" class="tooltip"></div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
